<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0b120f;
    color: #e8f0e6;
    user-select: none;
  }

  /* 动态背景：频谱可视化层 */
  #viz {
    position: fixed; inset: 0; width: 100%; height: 100%;
    opacity: .55; pointer-events: none; z-index: 0;
  }

  /* 渐变光晕背景 */
  .glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(49,194,124,.28) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(124,77,255,.22) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(49,194,124,.10) 0%, transparent 60%);
    animation: breathe 8s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    from { opacity: .8; transform: scale(1); }
    to   { opacity: 1; transform: scale(1.05); }
  }

  /* MV 视频层 */
  .mv-layer {
    position: fixed; inset: 0; z-index: 5;
    background: #000;
    display: none; align-items: center; justify-content: center;
  }
  .mv-layer.active { display: flex; }
  .mv-layer video {
    width: 100%; height: 100%; object-fit: contain;
  }
  .mv-close {
    position: absolute; top: 12px; right: 12px; z-index: 6;
    background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .mv-close:hover { background: rgba(49,194,124,.8); border-color: #31c27c; }

  /* 玻璃主卡片 */
  .player {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; padding: 14px 16px 12px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    padding: 20px 22px 18px;
    display: flex; flex-direction: column;
  }

  /* 顶部标题栏 */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .top-left { display: flex; align-items: center; gap: 10px; }
  .top-title {
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    color: rgba(255,255,255,.55); text-transform: uppercase;
  }
  .top-state {
    font-size: 11px; color: #31c27c; background: rgba(49,194,124,.12);
    padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(49,194,124,.25);
  }
  .list-toggle {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    color: rgba(255,255,255,.7); border-radius: 999px; padding: 5px 11px;
    font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px;
    transition: all .15s;
  }
  .list-toggle:hover { color: #31c27c; border-color: #31c27c; background: rgba(49,194,124,.1); }

  /* 封面 / 黑胶唱片 */
  .cover-wrap {
    position: relative; width: 180px; height: 180px; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .vinyl {
    width: 170px; height: 170px; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #111 18%, transparent 20%),
      repeating-radial-gradient(circle at 50% 50%, #1a1a1a 0, #1a1a1a 2px, #111 3px, #111 4px),
      linear-gradient(135deg, #31c27c, #7c4dff);
    box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 4px rgba(255,255,255,.06);
    animation: spin 8s linear infinite;
    animation-play-state: paused;
    position: relative;
  }
  .vinyl.playing { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vinyl::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.12), transparent 40%);
  }
  .cover-label {
    position: absolute; inset: 0; margin: auto;
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, #31c27c, #23a066);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .cover-label svg { width: 26px; height: 26px; opacity: .9; }

  /* 歌曲信息 */
  .info { text-align: center; margin-bottom: 16px; }
  .song-title {
    font-size: 17px; font-weight: 700; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 5px;
    text-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  .song-meta {
    font-size: 12px; color: rgba(255,255,255,.55);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.35); }

  /* 进度条 */
  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .time {
    font-size: 11px; color: rgba(255,255,255,.65); min-width: 38px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.14); outline: none; cursor: pointer; position: relative;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #31c27c; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(49,194,124,.6);
    transition: transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #31c27c; border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(49,194,124,.6);
  }

  /* 控制区 */
  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 12px; }
  .ctl {
    background: none; border: none; color: rgba(255,255,255,.85); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, color .12s; padding: 4px;
  }
  .ctl:hover { color: #31c27c; transform: translateY(-1px); }
  .ctl:active { transform: scale(.94); }
  .ctl-play {
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(145deg, #31c27c, #23a066);
    color: #fff;
    box-shadow: 0 8px 24px rgba(49,194,124,.45), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .ctl-play:hover { color: #fff; filter: brightness(1.08); }

  /* 底部：播放模式 + MV + 音量 */
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mode-segment {
    display: inline-flex; align-items: center;
    background: rgba(0,0,0,.22);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .mode-item {
    width: 32px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    cursor: pointer; color: rgba(255,255,255,.55);
    transition: all .18s ease;
    background: transparent; border: none;
  }
  .mode-item:hover { color: rgba(255,255,255,.9); background: rgba(255,255,255,.06); }
  .mode-item.active {
    background: linear-gradient(145deg, #31c27c, #23a066);
    color: #fff;
    box-shadow: 0 3px 10px rgba(49,194,124,.35);
  }
  .mode-item svg { display: block; }
  .mv-btn {
    font-size: 11px; color: rgba(255,255,255,.55);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .mv-btn:hover { color: #31c27c; border-color: #31c27c; }
  .vol-wrap { display: flex; align-items: center; gap: 8px; }
  .vol-slider { width: 72px; }

  /* 状态栏 */
  .status-line {
    margin-top: 12px; text-align: center; font-size: 11px;
    color: rgba(255,255,255,.42); min-height: 16px;
  }

  /* 播放列表抽屉（Apple Music 风格） */
  .playlist-overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .playlist-overlay.active { opacity: 1; pointer-events: auto; }
  .playlist {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 11;
    width: min(340px, 85vw);
    background: rgba(20,28,24,.92);
    border-left: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  .playlist.active { transform: translateX(0); }
  .plist-header {
    padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: space-between;
  }
  .plist-title { font-size: 16px; font-weight: 700; }
  .plist-count { font-size: 12px; color: rgba(255,255,255,.5); }
  .plist-close {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    color: rgba(255,255,255,.7); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .plist-close:hover { color: #fff; background: rgba(255,255,255,.15); }
  .plist-body {
    flex: 1; overflow-y: auto; padding: 8px 12px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.2) transparent;
  }
  .plist-body::-webkit-scrollbar { width: 6px; }
  .plist-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.2); border-radius: 3px;
  }
  .plist-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    transition: background .12s;
  }
  .plist-item:hover { background: rgba(255,255,255,.08); }
  .plist-item.active {
    background: rgba(49,194,124,.18);
    box-shadow: inset 2px 0 0 #31c27c;
  }
  .plist-num {
    width: 24px; text-align: center; font-size: 13px; color: rgba(255,255,255,.45);
    font-variant-numeric: tabular-nums;
  }
  .plist-item.active .plist-num { color: #31c27c; }
  .plist-info { flex: 1; min-width: 0; }
  .plist-name {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .plist-item.active .plist-name { color: #31c27c; }
  .plist-dur { font-size: 12px; color: rgba(255,255,255,.45); }
  .plist-item.active .plist-dur { color: rgba(49,194,124,.8); }
  .plist-play {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,.1); color: #fff;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s;
  }
  .plist-item:hover .plist-play { opacity: 1; }
  .plist-item.active .plist-play { opacity: 1; background: #31c27c; color: #fff; }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="glow"></div>

<div class="mv-layer" id="mvLayer">
  <video id="mvVideo" preload="metadata" playsinline></video>
  <button class="mv-close" onclick="toggleMV()">✕ 关闭 MV</button>
</div>

<div class="playlist-overlay" id="plistOverlay" onclick="togglePlaylist()"></div>
<div class="playlist" id="playlist">
  <div class="plist-header">
    <div>
      <div class="plist-title">播放列表</div>
      <div class="plist-count" id="plistCount">0 首歌曲</div>
    </div>
    <button class="plist-close" onclick="togglePlaylist()" title="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="plist-body" id="plistBody"></div>
</div>

<div class="player">
  <div class="card">
    <div class="top">
      <div class="top-left">
        <div class="top-title">MUSIC PLAYER</div>
        <button class="list-toggle" onclick="togglePlaylist()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
          <span>列表</span>
        </button>
      </div>
      <span class="top-state" id="playState">–</span>
    </div>

    <div class="cover-wrap">
      <div class="vinyl" id="vinyl">
        <div class="cover-label">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
      </div>
    </div>

    <div class="info">
      <div class="song-title" id="songTitle">未选择歌曲</div>
      <div class="song-meta">
        <span id="songCount">0 / 0</span>
        <span class="dot"></span>
        <span id="songDuration">0:00</span>
      </div>
    </div>

    <div class="progress-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
      <span class="time" id="totalTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctl" onclick="prevSong()" title="上一首">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctl ctl-play" id="playBtn" onclick="togglePlay()" title="播放/暂停">
        <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctl" onclick="nextSong()" title="下一首">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>

    <div class="bottom">
      <div class="mode-segment" id="modeSegment" title="播放模式">
        <button class="mode-item" data-mode="list" onclick="setMode('list')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="mode-item" data-mode="single" onclick="setMode('single')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><circle cx="12" cy="14" r="2.5" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="mode-item" data-mode="random" onclick="setMode('random')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="mode-item" data-mode="order" onclick="setMode('order')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16"/><path d="M8 7l12 5-12 5"/></svg>
        </button>
      </div>

      <div style="display:flex;align-items:center;gap:8px;">
        <button class="mv-btn" id="mvBtn" onclick="toggleMV()" title="播放 MV 视频">▶ MV</button>
        <div class="vol-wrap">
          <button class="ctl" id="volBtn" onclick="toggleMute()" title="静音">
            <svg id="volIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80" step="1" title="音量">
        </div>
      </div>
    </div>

    <div class="status-line" id="statusLine">独立播放器 · 刷新/切换页面不影响播放</div>
  </div>
</div>

<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

<script>
  var SONGS = {{ songs_json|safe }};
  var currentId = {{ current_id|default:'null' }};
  if (currentId) currentId = parseInt(currentId, 10);

  var audio = document.getElementById('audio');
  var mvVideo = document.getElementById('mvVideo');
  var idx = -1;
  var resumeTipShown = false;
  var mvMode = false;
  var plistOpen = false;

  // ===== 音频可视化 =====
  var audioCtx, analyser, source, dataArray;
  var vizCanvas = document.getElementById('viz');
  var vizCtx = vizCanvas.getContext('2d');
  function resizeViz() {
    vizCanvas.width = window.innerWidth;
    vizCanvas.height = window.innerHeight;
  }
  resizeViz();
  window.addEventListener('resize', resizeViz);

  function initAudioContext() {
    if (audioCtx) return;
    try {
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      drawViz();
    } catch (e) { console.log('可视化初始化失败', e); }
  }

  function drawViz() {
    requestAnimationFrame(drawViz);
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    var w = vizCanvas.width, h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);

    var barCount = dataArray.length;
    var radius = Math.min(w, h) * 0.35;
    var cx = w / 2, cy = h / 2;
    var step = (Math.PI * 2) / barCount;

    for (var i = 0; i < barCount; i++) {
      var value = dataArray[i];
      var barHeight = (value / 255) * (Math.min(w, h) * 0.28);
      var angle = i * step - Math.PI / 2;
      var x1 = cx + Math.cos(angle) * radius;
      var y1 = cy + Math.sin(angle) * radius;
      var x2 = cx + Math.cos(angle) * (radius + barHeight);
      var y2 = cy + Math.sin(angle) * (radius + barHeight);

      var grad = vizCtx.createLinearGradient(x1, y1, x2, y2);
      grad.addColorStop(0, 'rgba(49,194,124,.5)');
      grad.addColorStop(1, 'rgba(124,77,255,.35)');
      vizCtx.strokeStyle = grad;
      vizCtx.lineWidth = 3;
      vizCtx.lineCap = 'round';
      vizCtx.beginPath();
      vizCtx.moveTo(x1, y1);
      vizCtx.lineTo(x2, y2);
      vizCtx.stroke();
    }
  }

  // ===== 播放列表 =====
  function renderPlaylist() {
    var body = document.getElementById('plistBody');
    document.getElementById('plistCount').textContent = SONGS.length + ' 首歌曲';
    if (!SONGS.length) { body.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.4)">暂无歌曲</div>'; return; }
    body.innerHTML = SONGS.map(function (s, i) {
      var active = i === idx ? ' active' : '';
      var playing = i === idx && !currentMedia().paused;
      var icon = playing
        ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
        : '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      return '<div class="plist-item' + active + '" onclick="playById(' + s.id + ')" title="' + escapeHtml(s.title) + '">'
        + '<div class="plist-num">' + (i + 1) + '</div>'
        + '<div class="plist-info">'
        + '<div class="plist-name">' + escapeHtml(s.title) + '</div>'
        + '<div class="plist-dur">' + fmt(s.duration || 0) + '</div>'
        + '</div>'
        + '<div class="plist-play">' + icon + '</div>'
        + '</div>';
    }).join('');
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function togglePlaylist() {
    plistOpen = !plistOpen;
    document.getElementById('plistOverlay').classList.toggle('active', plistOpen);
    document.getElementById('playlist').classList.toggle('active', plistOpen);
    if (plistOpen) renderPlaylist();
  }

  function currentMedia() {
    return (mvMode && SONGS[idx] && SONGS[idx].video_url) ? mvVideo : audio;
  }

  function findIndex(id) {
    for (var i = 0; i < SONGS.length; i++) if (SONGS[i].id === id) return i;
    return -1;
  }

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function loadSong(i) {
    if (!SONGS.length || i < 0 || i >= SONGS.length) return;
    idx = i;
    var s = SONGS[i];
    document.getElementById('songTitle').textContent = s.title || ('歌曲 ' + s.id);
    document.getElementById('songCount').textContent = (i + 1) + ' / ' + SONGS.length;
    document.getElementById('totalTime').textContent = s.duration ? fmt(s.duration) : '0:00';
    document.getElementById('songDuration').textContent = s.duration ? fmt(s.duration) : '0:00';
    document.getElementById('seekBar').value = 0;
    document.getElementById('curTime').textContent = '0:00';
    audio.src = s.audio_url;
    mvVideo.src = s.video_url || '';
    audio.load();
    mvVideo.load();

    try {
      var prog = JSON.parse(localStorage.getItem('vocab-music-progress') || 'null');
      if (prog && prog.id === s.id && prog.time > 3 && !resumeTipShown) {
        resumeTipShown = true;
        document.getElementById('statusLine').textContent = '已从 ' + fmt(prog.time) + ' 继续播放';
        audio.currentTime = prog.time;
        mvVideo.currentTime = prog.time;
      }
    } catch (e) {}

    // 当前歌曲无视频时自动退出 MV 模式
    if (mvMode && !s.video_url) {
      mvMode = false;
      document.getElementById('mvLayer').classList.remove('active');
      flashStatus('当前歌曲无视频，已退出 MV 模式');
    }

    initAudioContext();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (mvMode && s.video_url) {
      audio.pause();
      mvVideo.play().catch(function () { setPlayState(false); });
    } else {
      mvVideo.pause();
      audio.play().catch(function () { setPlayState(false); });
    }
    if (plistOpen) renderPlaylist();
  }

  function playById(id) {
    var i = findIndex(id);
    if (i >= 0) loadSong(i);
  }

  function nextSong() {
    if (!SONGS.length) return;
    if (playMode === 'random') playRandom();
    else loadSong((idx + 1) % SONGS.length);
  }
  function prevSong() {
    if (!SONGS.length) return;
    loadSong((idx - 1 + SONGS.length) % SONGS.length);
  }
  function playRandom() {
    if (SONGS.length < 2) { loadSong(idx); return; }
    var r = idx;
    while (r === idx) r = Math.floor(Math.random() * SONGS.length);
    loadSong(r);
  }

  function togglePlay() {
    if (idx < 0 && SONGS.length) { playById(currentId || SONGS[0].id); return; }
    initAudioContext();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    var media = currentMedia();
    if (media.paused) media.play(); else media.pause();
  }

  function setPlayState(playing) {
    var icon = document.getElementById('playIcon');
    icon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    document.getElementById('playState').textContent = playing ? '播放中' : '已暂停';
    document.getElementById('vinyl').classList.toggle('playing', playing);
    document.getElementById('mvBtn').textContent = (playing && mvMode) ? '⏸ MV' : '▶ MV';
    if (plistOpen) renderPlaylist();
  }

  // ===== MV 切换 =====
  function toggleMV() {
    var s = SONGS[idx];
    if (!s || !s.video_url) {
      flashStatus('当前歌曲没有视频文件');
      return;
    }
    mvMode = !mvMode;
    document.getElementById('mvLayer').classList.toggle('active', mvMode);
    var curTime = mvMode ? audio.currentTime : mvVideo.currentTime;
    if (mvMode) {
      audio.pause();
      if (isFinite(curTime)) mvVideo.currentTime = curTime;
      mvVideo.play().catch(function () { setPlayState(false); });
      flashStatus('已切换到 MV 视频模式');
    } else {
      mvVideo.pause();
      if (isFinite(curTime)) audio.currentTime = curTime;
      audio.play().catch(function () { setPlayState(false); });
      flashStatus('已切换到音频模式');
    }
  }

  // ===== 播放模式（分段控制器） =====
  var MODES = ['list', 'single', 'random', 'order'];
  var MODE_TIPS = { list: '列表循环', single: '单曲循环', random: '随机播放', order: '顺序播放' };
  var playMode = 'list';
  try { playMode = localStorage.getItem('vocab-music-mode') || 'list'; } catch (e) {}
  if (MODES.indexOf(playMode) === -1) playMode = 'list';

  function renderMode() {
    document.querySelectorAll('.mode-item').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === playMode);
      btn.title = MODE_TIPS[btn.getAttribute('data-mode')];
    });
    try { localStorage.setItem('vocab-music-mode', playMode); } catch (e) {}
  }

  function setMode(mode) {
    if (MODES.indexOf(mode) === -1) return;
    playMode = mode;
    renderMode();
    flashStatus('已切换为「' + MODE_TIPS[playMode] + '」');
  }

  var statusTimer = null;
  function flashStatus(msg) {
    var el = document.getElementById('statusLine');
    el.textContent = msg;
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      el.textContent = '独立播放器 · 刷新/切换页面不影响播放';
    }, 1800);
  }

  // ===== 音量控制 =====
  var volSlider = document.getElementById('volSlider');
  var lastVol = 0.8;
  try { var sv = localStorage.getItem('vocab-music-vol'); if (sv !== null) lastVol = parseFloat(sv); } catch (e) {}

  function applyVol() {
    audio.volume = lastVol;
    mvVideo.volume = lastVol;
    audio.muted = false;
    mvVideo.muted = false;
    volSlider.value = Math.round(lastVol * 100);
    document.getElementById('volBtn').title = '音量 ' + Math.round(lastVol * 100) + '%';
    try { localStorage.setItem('vocab-music-vol', String(lastVol)); } catch (e) {}
  }
  function toggleMute() {
    audio.muted = !audio.muted;
    mvVideo.muted = audio.muted;
    var ic = document.getElementById('volIcon');
    ic.innerHTML = audio.muted
      ? '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 0c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/><path d="M16 8l5 8M21 8l-5 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
      : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    flashStatus(audio.muted ? '已静音' : '已取消静音');
  }
  volSlider.addEventListener('input', function () {
    lastVol = parseFloat(this.value) / 100;
    audio.volume = lastVol;
    mvVideo.volume = lastVol;
    audio.muted = false;
    mvVideo.muted = false;
    if (lastVol === 0) {
      document.getElementById('volIcon').innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8l5 8M21 8l-5 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    } else if (audio.muted) {
      audio.muted = false;
      mvVideo.muted = false;
      document.getElementById('volIcon').innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }
    try { localStorage.setItem('vocab-music-vol', String(lastVol)); } catch (e) {}
  });

  // ===== 播放事件 =====
  audio.addEventListener('play', function () {
    setPlayState(true);
    document.title = '▶ ' + (SONGS[idx] ? SONGS[idx].title : '') + ' - 音乐播放器';
    broadcast({ type: 'status', state: 'playing', id: SONGS[idx] ? SONGS[idx].id : null });
  });
  audio.addEventListener('pause', function () {
    setPlayState(false);
    document.title = '⏸ ' + (SONGS[idx] ? SONGS[idx].title : '') + ' - 音乐播放器';
    broadcast({ type: 'status', state: 'paused', id: SONGS[idx] ? SONGS[idx].id : null });
  });
  audio.addEventListener('ended', function () {
    if (playMode === 'single') {
      audio.currentTime = 0;
      audio.play();
    } else if (playMode === 'order') {
      if (idx < SONGS.length - 1) loadSong(idx + 1);
      else setPlayState(false);
    } else {
      nextSong();
    }
  });
  audio.addEventListener('timeupdate', function () {
    if (mvMode && SONGS[idx] && SONGS[idx].video_url) return;
    document.getElementById('curTime').textContent = fmt(audio.currentTime);
    if (audio.duration && isFinite(audio.duration)) {
      document.getElementById('seekBar').max = audio.duration;
      document.getElementById('seekBar').value = audio.currentTime;
      document.getElementById('totalTime').textContent = fmt(audio.duration);
    }
    if (Math.floor(audio.currentTime) % 5 === 0 && SONGS[idx]) {
      try {
        localStorage.setItem('vocab-music-progress', JSON.stringify({
          id: SONGS[idx].id, time: audio.currentTime, title: SONGS[idx].title
        }));
      } catch (e) {}
    }
  });
  audio.addEventListener('loadedmetadata', function () {
    if (mvMode && SONGS[idx] && SONGS[idx].video_url) return;
    if (audio.duration && isFinite(audio.duration)) {
      document.getElementById('totalTime').textContent = fmt(audio.duration);
      document.getElementById('songDuration').textContent = fmt(audio.duration);
      document.getElementById('seekBar').max = audio.duration;
    }
  });
  document.getElementById('seekBar').addEventListener('input', function () {
    var t = parseFloat(this.value);
    if (mvMode && SONGS[idx] && SONGS[idx].video_url) {
      mvVideo.currentTime = t;
    } else {
      audio.currentTime = t;
    }
    document.getElementById('curTime').textContent = fmt(t);
  });

  // ===== video 事件同步（MV 模式） =====
  mvVideo.addEventListener('play', function () { setPlayState(true); });
  mvVideo.addEventListener('pause', function () { setPlayState(false); });
  mvVideo.addEventListener('ended', function () {
    if (playMode === 'single') {
      mvVideo.currentTime = 0;
      mvVideo.play();
    } else if (playMode === 'order') {
      if (idx < SONGS.length - 1) loadSong(idx + 1);
      else setPlayState(false);
    } else {
      nextSong();
    }
  });
  mvVideo.addEventListener('timeupdate', function () {
    if (!mvMode) return;
    document.getElementById('curTime').textContent = fmt(mvVideo.currentTime);
    if (mvVideo.duration && isFinite(mvVideo.duration)) {
      document.getElementById('seekBar').max = mvVideo.duration;
      document.getElementById('seekBar').value = mvVideo.currentTime;
      document.getElementById('totalTime').textContent = fmt(mvVideo.duration);
    }
    if (Math.floor(mvVideo.currentTime) % 5 === 0 && SONGS[idx]) {
      try {
        localStorage.setItem('vocab-music-progress', JSON.stringify({
          id: SONGS[idx].id, time: mvVideo.currentTime, title: SONGS[idx].title
        }));
      } catch (e) {}
    }
  });
  mvVideo.addEventListener('loadedmetadata', function () {
    if (!mvMode) return;
    if (mvVideo.duration && isFinite(mvVideo.duration)) {
      document.getElementById('totalTime').textContent = fmt(mvVideo.duration);
      document.getElementById('songDuration').textContent = fmt(mvVideo.duration);
      document.getElementById('seekBar').max = mvVideo.duration;
    }
  });

  // ===== 与主页面通信 =====
  window.addEventListener('message', function (ev) {
    if (ev.origin !== location.origin) return;
    var m = ev.data || {};
    if (m.type === 'play' && m.id) playById(m.id);
    else if (m.type === 'toggle') togglePlay();
    else if (m.type === 'next') nextSong();
    else if (m.type === 'prev') prevSong();
  });

  var bc = null;
  try { bc = new BroadcastChannel('vocab-music'); } catch (e) {}
  function broadcast(msg) { if (bc) bc.postMessage(msg); }
  if (bc) {
    bc.onmessage = function (ev) {
      var m = ev.data || {};
      if (m.type === 'play' && m.id) playById(m.id);
      else if (m.type === 'toggle') togglePlay();
      else if (m.type === 'next') nextSong();
      else if (m.type === 'prev') prevSong();
    };
  }

  // ===== 初始化 =====
  renderMode();
  applyVol();
  renderPlaylist();
  if (SONGS.length) {
    if (currentId) {
      playById(currentId);
    } else {
      try {
        var prog = JSON.parse(localStorage.getItem('vocab-music-progress') || 'null');
        if (prog && prog.id) playById(prog.id);
      } catch (e) {}
      if (idx < 0) idx = 0;
    }
  }
  setPlayState(false);
</script>
</body>
</html>
