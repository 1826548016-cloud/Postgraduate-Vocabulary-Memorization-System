{% extends 'base.html' %}
{% load static %}

{% block title %}背诵中{% endblock %}
{% block page_title %}背诵中{% endblock %}

{% block content %}
{% csrf_token %}
<style>
  /* 展开笔记/速记时卡片放大 */
  .word-card-expanded { max-width: 780px; }
  .word-ext-panel {
    margin-top: 22px; padding-top: 16px;
    border-top: 1px dashed var(--c-border);
    text-align: left;
  }
</style>

<div class="card mb-4">
  <div class="flex justify-between items-center gap-4 mb-4">
    <div class="text-secondary text-sm">
      <span>进度：</span>
      <span id="progressText">-</span>
    </div>
    <div class="flex gap-2 items-center">
      <button id="focusModeBtn" class="btn btn-secondary btn-sm" onclick="toggleFocusMode()" title="全屏沉浸式背诵"><i class="ph ph-eye"></i> 专注模式</button>
      <span class="badge badge-learning">{{ mode }}</span>
    </div>
  </div>
  <div class="progress-bar">
    <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
  </div>
</div>

<div id="wordCard" class="card word-card">
  <div id="wordText" class="word-text">加载中…</div>
  <div class="flex gap-2 items-center" style="margin-bottom: 12px;">
    <button id="speakBtn" class="btn btn-secondary btn-sm" title="发音">🔊 发音</button>
    <button id="noteBtn" class="btn btn-secondary btn-sm" title="记笔记 / 查看笔记"><i class="ph ph-note-pencil"></i> 笔记</button>
    <button id="quickMemoryBtn" class="btn btn-secondary btn-sm" title="AI 速记 / 查看速记"><i class="ph ph-lightning"></i> 速记</button>
  </div>
  <div id="wordPhonetic" class="word-phonetic">—</div>
  <div id="wordPos" class="word-pos">—</div>
  <div id="wordMeaning" class="word-meaning hidden">—</div>
  <div id="wordExample" class="word-example hidden">—</div>

  <div class="word-card-actions">
    <button id="revealBtn" class="btn btn-primary btn-lg">显示释义 <span class="text-sm">(空格)</span></button>
  </div>

  <div class="word-card-actions">
    <button data-action="mastered" class="mark-btn btn btn-primary btn-lg">会 <span class="text-sm">(1)</span></button>
    <button data-action="unknown" class="mark-btn btn btn-danger btn-lg">不会 <span class="text-sm">(2)</span></button>
  </div>

  <div class="flex justify-center gap-4 mt-6">
    <button id="prevBtn" class="btn btn-secondary">上一词 <span class="text-sm">(←)</span></button>
    <button id="nextBtn" class="btn btn-secondary">下一词 <span class="text-sm">(→)</span></button>
  </div>

  <!-- 笔记 / 速记 展开区（不弹窗，直接显示在卡片下方，卡片自动放大） -->
  <div id="wordExtPanel" class="word-ext-panel hidden">
    <!-- 笔记面板 -->
    <div id="notePanel" class="hidden">
      <div class="flex justify-between items-center" style="margin-bottom: 8px;">
        <div style="font-weight: 600; font-size: var(--fs-sm);"><i class="ph ph-note-pencil" style="color: var(--c-green);"></i> 笔记 <span id="noteWordTitle" class="text-secondary" style="font-weight: normal; font-size: var(--fs-xs);"></span></div>
        <button class="btn btn-ghost btn-sm" onclick="closeExtPanel()">收起 <i class="ph ph-x"></i></button>
      </div>
      <div id="noteMeta" class="text-sm text-secondary" style="margin-bottom: 6px;">加载中…</div>
      <textarea id="noteContent" class="form-input" rows="4" style="resize: vertical;" placeholder="记录这个单词的记忆方法、例句、易错点…"></textarea>
      <div class="flex gap-2" style="margin-top: 8px; align-items: center;">
        <input id="notePage" class="form-input" type="number" placeholder="页码（可选）" style="width: 130px;">
        <button id="noteDeleteBtn" class="btn btn-danger btn-sm hidden" onclick="deleteNote()"><i class="ph ph-trash"></i> 删除</button>
        <span style="flex: 1;"></span>
        <button class="btn btn-primary btn-sm" onclick="saveNote()"><i class="ph ph-check"></i> 保存笔记</button>
      </div>
    </div>

    <!-- 速记面板 -->
    <div id="qmPanel" class="hidden">
      <div class="flex justify-between items-center" style="margin-bottom: 8px;">
        <div style="font-weight: 600; font-size: var(--fs-sm);"><i class="ph ph-lightning" style="color: var(--c-amber);"></i> 速记 <span id="qmWordTitle" class="text-secondary" style="font-weight: normal; font-size: var(--fs-xs);"></span></div>
        <button class="btn btn-ghost btn-sm" onclick="closeExtPanel()">收起 <i class="ph ph-x"></i></button>
      </div>
      <div id="qmMeta" class="text-sm text-secondary" style="margin-bottom: 6px;">加载中…</div>
      <textarea id="qmContent" class="form-input" rows="10" style="resize: vertical; font-family: monospace; line-height: 1.7;" placeholder="点击「生成速记」让 AI 为你创作，或直接手动输入。"></textarea>
      <div class="flex gap-2" style="margin-top: 8px; align-items: center; flex-wrap: wrap;">
        <button id="qmGenerateBtn" class="btn btn-primary btn-sm hidden" onclick="generateQuickMemory(false)"><i class="ph ph-magic-wand"></i> 生成速记</button>
        <button id="qmRegenBtn" class="btn btn-secondary btn-sm hidden" onclick="generateQuickMemory(true)" title="重新调用 AI 生成（会覆盖当前内容）"><i class="ph ph-arrows-clockwise"></i> 重新生成</button>
        <button id="qmDeleteBtn" class="btn btn-danger btn-sm hidden" onclick="deleteQuickMemory()"><i class="ph ph-trash"></i> 删除</button>
        <span style="flex: 1;"></span>
        <button class="btn btn-primary btn-sm" onclick="saveQuickMemory()"><i class="ph ph-check"></i> 保存</button>
      </div>
    </div>
  </div>
</div>

<div id="completionCard" class="card word-card hidden">
  <div class="card-header"><i class="ph ph-check-circle" style="color: var(--c-green);"></i> 背诵完成</div>
  <p class="text-secondary" id="completionMsg"></p>
  <div class="summary-grid">
    <div class="summary-card">
      <div id="masteredCount" class="summary-value text-accent">0</div>
      <div class="summary-label">会</div>
    </div>
    <div class="summary-card">
      <div id="unknownCount" class="summary-value">0</div>
      <div class="summary-label">不会</div>
    </div>
  </div>
  <a href="{% url 'words:dashboard' %}" class="btn btn-primary btn-lg">返回仪表盘</a>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function() {
  var wordsData = {{ words_json|safe }};
  var wordCount = wordsData.length;
  var mode = '{{ mode|escapejs }}';

  // Restore index from sessionStorage (survives page refresh)
  var savedIndex = sessionStorage.getItem('vocab-learn-idx');
  var currentIndex = (savedIndex !== null) ? parseInt(savedIndex) : 0;
  var currentWord = null;
  var revealed = false;

  var counts = { mastered: 0, unknown: 0 };
  // Restore counts so refresh keeps 会/不会统计
  try {
    var savedCounts = JSON.parse(sessionStorage.getItem('vocab-learn-counts') || 'null');
    if (savedCounts) {
      counts.mastered = savedCounts.mastered || 0;
      counts.unknown = savedCounts.unknown || 0;
    }
  } catch (e) {}

  var els = {
    progressText: document.getElementById('progressText'),
    progressFill: document.getElementById('progressFill'),
    wordCard: document.getElementById('wordCard'),
    wordText: document.getElementById('wordText'),
    wordPhonetic: document.getElementById('wordPhonetic'),
    wordPos: document.getElementById('wordPos'),
    wordMeaning: document.getElementById('wordMeaning'),
    wordExample: document.getElementById('wordExample'),
    revealBtn: document.getElementById('revealBtn'),
    completionCard: document.getElementById('completionCard'),
    masteredCount: document.getElementById('masteredCount'),
    unknownCount: document.getElementById('unknownCount'),
    completionMsg: document.getElementById('completionMsg'),
  };

  var focusActive = false;

  function toggleFocusMode() {
    focusActive = !focusActive;
    if (focusActive) {
      document.body.classList.add('focus-active');
      document.getElementById('focusModeBtn').innerHTML = '<i class="ph ph-x"></i> 退出专注';
      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        }
      } catch (e) {}
    } else {
      document.body.classList.remove('focus-active');
      document.getElementById('focusModeBtn').innerHTML = '<i class="ph ph-eye"></i> 专注模式';
      try {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
      } catch (e) {}
    }
    // Trigger resize to re-layout
    window.dispatchEvent(new Event('resize'));
  }

  // Listen for ESC to exit focus mode
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && focusActive) {
      focusActive = false;
      document.body.classList.remove('focus-active');
      document.getElementById('focusModeBtn').innerHTML = '<i class="ph ph-eye"></i> 专注模式';
    }
  });

  function saveProgress() {
    sessionStorage.setItem('vocab-learn-idx', currentIndex);
  }

  function updateProgress() {
    var pct = wordCount > 0 ? ((currentIndex + 1) / wordCount * 100) : 0;
    els.progressText.textContent = (currentIndex + 1) + ' / ' + wordCount;
    els.progressFill.style.width = pct + '%';
  }

  function doSpeak(text) { window.VOCAB_SPEAK(text); }

  function replayAudio() {
    if (currentWord) doSpeak(currentWord.word || '');
  }

  function formatMeanings(meanings) {
    if (!meanings) return '';
    if (Array.isArray(meanings)) {
      return meanings.map(function(m, i) { return (i + 1) + '. ' + m; }).join('\n');
    }
    return String(meanings);
  }

  function renderWord() {
    if (currentIndex >= wordCount) {
      showCompletion();
      return;
    }

    // 切换单词时收起笔记/速记展开区
    closeExtPanel();

    currentWord = wordsData[currentIndex];
    revealed = false;

    els.wordText.textContent = currentWord.word || '';
    els.wordPhonetic.textContent = currentWord.phonetic_us || '';
    els.wordPos.textContent = currentWord.pos || '';
    els.wordMeaning.textContent = formatMeanings(currentWord.meanings);
    els.wordMeaning.classList.add('hidden');
    els.wordExample.textContent = (currentWord.example_en || '') + '\n' + (currentWord.example_zh || '');
    els.wordExample.classList.add('hidden');
    els.wordText.classList.remove('cover-mask');
    els.revealBtn.textContent = '显示释义 (空格键)';
    els.revealBtn.disabled = false;

    updateProgress();
    saveProgress();
    doSpeak(currentWord.word || '');
  }

  function reveal() {
    if (revealed || !currentWord) return;
    revealed = true;
    els.wordMeaning.classList.remove('hidden');
    els.wordExample.classList.remove('hidden');
    els.revealBtn.textContent = '已显示';
    els.revealBtn.disabled = true;
  }

  function mark(action) {
    if (!currentWord) return;
    counts[action] = (counts[action] || 0) + 1;
    sessionStorage.setItem('vocab-learn-counts', JSON.stringify(counts));

    VOCAB_API.post('/api/mark/' + action + '/' + currentWord.id + '/', {})
      .then(function (res) {
        if (res && res.auto_checked) showToast('今日已背诵 30 词，自动打卡成功！', 'success');
        advance();
      })
      .catch(function (err) {
        if (typeof showToast === 'function') showToast('标记失败', 'error');
      });
  }

  function advance() {
    if (currentIndex >= wordCount - 1) {
      showCompletion();
      return;
    }
    currentIndex++;
    renderWord();
  }

  function goPrev() {
    if (currentIndex <= 0) return;
    currentIndex--;
    renderWord();
  }

  function goNext() {
    advance();
  }

  function showCompletion() {
    els.wordCard.classList.add('hidden');
    els.completionCard.classList.remove('hidden');
    els.masteredCount.textContent = counts.mastered;
    els.unknownCount.textContent = counts.unknown;
    var msg = '本次共学习 ' + wordCount + ' 个单词';
    els.completionMsg.textContent = msg;
    sessionStorage.removeItem('vocab-learn-idx');
    sessionStorage.removeItem('vocab-learn-counts');
  }

  // ===== 笔记：记笔记 / 查看之前的笔记（保存到数据库） =====
  var noteWordId = null;

  function loadNoteForPanel() {
    noteWordId = currentWord.id;
    document.getElementById('noteWordTitle').textContent = '· ' + (currentWord.word || '');
    document.getElementById('noteMeta').textContent = '加载中…';
    document.getElementById('noteContent').value = '';
    document.getElementById('notePage').value = '';
    document.getElementById('noteDeleteBtn').classList.add('hidden');

    // 读取数据库中的历史笔记
    VOCAB_API.get('/api/note/' + noteWordId + '/')
      .then(function (res) {
        if (res && res.success) {
          document.getElementById('noteContent').value = res.content || '';
          document.getElementById('notePage').value = res.page_number || '';
          var meta = res.content ? '查看之前的笔记' : '暂无笔记，记录你的记忆方法吧';
          if (res.updated_at) meta += ' · 更新于 ' + res.updated_at;
          document.getElementById('noteMeta').textContent = meta;
          if (res.content) document.getElementById('noteDeleteBtn').classList.remove('hidden');
        }
      })
      .catch(function () {
        document.getElementById('noteMeta').textContent = '加载笔记失败';
      });
  }

  // ===== 展开区：在单词卡下方直接展示（不弹窗），卡片自动放大 =====
  function openExtPanel(type) {
    if (!currentWord) return;
    document.getElementById('wordCard').classList.add('word-card-expanded');
    document.getElementById('wordExtPanel').classList.remove('hidden');
    if (type === 'note') {
      document.getElementById('notePanel').classList.remove('hidden');
      document.getElementById('qmPanel').classList.add('hidden');
      loadNoteForPanel();
    } else {
      document.getElementById('qmPanel').classList.remove('hidden');
      document.getElementById('notePanel').classList.add('hidden');
      loadQuickMemoryForPanel();
    }
    document.getElementById('wordExtPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function closeExtPanel() {
    document.getElementById('wordCard').classList.remove('word-card-expanded');
    document.getElementById('wordExtPanel').classList.add('hidden');
    document.getElementById('notePanel').classList.add('hidden');
    document.getElementById('qmPanel').classList.add('hidden');
  }

  function saveNote() {
    if (!noteWordId) return;
    var content = document.getElementById('noteContent').value;
    var pageNumber = document.getElementById('notePage').value;
    VOCAB_API.post('/api/note/' + noteWordId + '/', {
      content: content,
      page_number: pageNumber === '' ? null : (parseInt(pageNumber, 10) || null),
    })
      .then(function (res) {
        if (res && res.success) {
          showToast('笔记已保存', 'success');
          document.getElementById('noteDeleteBtn').classList.remove('hidden');
          closeExtPanel();
        } else {
          showToast((res && res.error) || '保存失败', 'error');
        }
      })
      .catch(function (e) {
        showToast((e && e.error) || '保存失败', 'error');
      });
  }

  function deleteNote() {
    if (!noteWordId) return;
    if (!confirm('确定删除这条笔记吗？')) return;
    VOCAB_API.del('/api/note/' + noteWordId + '/')
      .then(function (res) {
        if (res && res.success) {
          showToast('笔记已删除', 'success');
          document.getElementById('noteDeleteBtn').classList.add('hidden');
          document.getElementById('noteContent').value = '';
          document.getElementById('notePage').value = '';
          document.getElementById('noteMeta').textContent = '暂无笔记，记录你的记忆方法吧';
        }
      })
      .catch(function () {
        showToast('删除失败', 'error');
      });
  }

  // 暴露给内联 onclick
  window.openExtPanel = openExtPanel;
  window.closeExtPanel = closeExtPanel;
  window.saveNote = saveNote;
  window.deleteNote = deleteNote;

  // ===== 速记：AI 生成并缓存到数据库，下次直接读取不再调用 AI =====
  var qmWordId = null;
  // 模型配置已统一由「设置 → AI 模型」管理（数据库），生成时后端自动读取启用模型
  var AI_SETTINGS_URL = "{% url 'words:settings_page' %}#ai-models";

  // 检查是否已配置可用的 AI 模型
  function checkAIModelConfigured() {
    return VOCAB_API.get('/api/ai-models/').then(function (res) {
      var models = (res && res.models) || [];
      return models.some(function (m) { return m.enabled; });
    }).catch(function () { return false; });
  }

  function loadQuickMemoryForPanel() {
    qmWordId = currentWord.id;
    document.getElementById('qmWordTitle').textContent = '· ' + (currentWord.word || '');
    document.getElementById('qmMeta').textContent = '加载中…';
    document.getElementById('qmContent').value = '';
    document.getElementById('qmGenerateBtn').classList.add('hidden');
    document.getElementById('qmRegenBtn').classList.add('hidden');
    document.getElementById('qmDeleteBtn').classList.add('hidden');

    // 先从数据库读取：有则直接显示，无则提示生成
    VOCAB_API.get('/api/word/' + qmWordId + '/quick-memory/')
      .then(function (res) {
        if (res && res.success && res.content) {
          document.getElementById('qmContent').value = res.content;
          var meta = '已保存的速记（来自数据库，无需重新调用 AI）';
          if (res.updated_at) meta += ' · 更新于 ' + res.updated_at;
          document.getElementById('qmMeta').textContent = meta;
          document.getElementById('qmRegenBtn').classList.remove('hidden');
          document.getElementById('qmDeleteBtn').classList.remove('hidden');
        } else {
          // 无速记：已配置 AI 模型则显示「生成速记」，否则引导去设置页
          checkAIModelConfigured().then(function (ok) {
            if (ok) {
              document.getElementById('qmContent').value = '';
              document.getElementById('qmMeta').textContent = '还没有速记，点击「生成速记」让 AI 为你创作（结果保存到数据库，下次直接查看）';
              document.getElementById('qmGenerateBtn').classList.remove('hidden');
            } else {
              document.getElementById('qmMeta').innerHTML = '尚未配置 AI 模型，请先到 <a href="' + AI_SETTINGS_URL + '" style="color: var(--c-green);">设置 → AI 模型</a> 中添加并启用一个模型';
            }
          });
        }
      })
      .catch(function () {
        document.getElementById('qmMeta').textContent = '加载速记失败';
        document.getElementById('qmGenerateBtn').classList.remove('hidden');
      });
  }

  function saveQuickMemory() {
    if (!qmWordId) return;
    var content = document.getElementById('qmContent').value;
    VOCAB_API.post('/api/word/' + qmWordId + '/quick-memory/', { content: content })
      .then(function (res) {
        if (res && res.success) {
          showToast('速记已保存', 'success');
          document.getElementById('qmMeta').textContent = '已保存的速记（来自数据库，无需重新调用 AI）';
          document.getElementById('qmRegenBtn').classList.remove('hidden');
          document.getElementById('qmDeleteBtn').classList.remove('hidden');
          document.getElementById('qmGenerateBtn').classList.add('hidden');
          closeExtPanel();
        } else {
          showToast((res && res.error) || '保存失败', 'error');
        }
      })
      .catch(function (e) {
        showToast((e && e.error) || '保存失败', 'error');
      });
  }

  function deleteQuickMemory() {
    if (!qmWordId) return;
    if (!confirm('确定删除这条速记吗？')) return;
    VOCAB_API.del('/api/word/' + qmWordId + '/quick-memory/')
      .then(function (res) {
        if (res && res.success) {
          showToast('速记已删除', 'success');
          document.getElementById('qmContent').value = '';
          document.getElementById('qmMeta').textContent = '还没有速记，点击「生成速记」让 AI 为你创作';
          document.getElementById('qmGenerateBtn').classList.remove('hidden');
          document.getElementById('qmRegenBtn').classList.add('hidden');
          document.getElementById('qmDeleteBtn').classList.add('hidden');
        }
      })
      .catch(function () {
        showToast('删除失败', 'error');
      });
  }

  function generateQuickMemory(force) {
    if (!qmWordId) return;
    var btn = document.getElementById('qmGenerateBtn');
    btn.disabled = true;
    var oldHtml = btn.innerHTML;
    btn.innerHTML = '<i class="ph ph-circle-notch" style="animation: spin 1s linear infinite;"></i> AI 生成中…';
    document.getElementById('qmMeta').textContent = 'AI 正在创作速记，请稍候…';

    // 模型配置由设置页统一管理（数据库），后端自动读取启用模型；未配置时后端返回提示
    VOCAB_API.post('/api/word/' + qmWordId + '/quick-memory/generate/', {
      force: !!force,
    })
      .then(function (res) {
        if (res && res.success) {
          document.getElementById('qmContent').value = res.content || '';
          document.getElementById('qmMeta').textContent = res.cached
            ? '已使用数据库中的速记（无需重新调用 AI）'
            : 'AI 生成完成，已保存到数据库（下次直接查看，不再调用 AI）';
          document.getElementById('qmRegenBtn').classList.remove('hidden');
          document.getElementById('qmDeleteBtn').classList.remove('hidden');
          document.getElementById('qmGenerateBtn').classList.add('hidden');
        } else {
          var err = (res && res.error) || '生成失败';
          if (err.indexOf('尚未配置 AI 模型') !== -1) {
            document.getElementById('qmMeta').innerHTML = '尚未配置 AI 模型，请先到 <a href="' + AI_SETTINGS_URL + '" style="color: var(--c-green);">设置 → AI 模型</a> 中添加并启用一个模型';
          } else {
            document.getElementById('qmMeta').textContent = err;
          }
          showToast(err, 'error');
        }
      })
      .catch(function (e) {
        var err = (e && e.error) || '生成失败，请检查模型配置';
        document.getElementById('qmMeta').textContent = err;
        showToast(err, 'error');
      })
      .then(function () {
        btn.disabled = false;
        btn.innerHTML = oldHtml;
      });
  }

  // 暴露给内联 onclick
  window.saveQuickMemory = saveQuickMemory;
  window.deleteQuickMemory = deleteQuickMemory;
  window.generateQuickMemory = generateQuickMemory;

  // Button bindings
  els.revealBtn.addEventListener('click', reveal);
  document.getElementById('speakBtn').addEventListener('click', replayAudio);
  document.getElementById('noteBtn').addEventListener('click', function () { openExtPanel('note'); });
  document.getElementById('quickMemoryBtn').addEventListener('click', function () { openExtPanel('qm'); });
  document.getElementById('prevBtn').addEventListener('click', goPrev);
  document.getElementById('nextBtn').addEventListener('click', goNext);

  document.querySelectorAll('.mark-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { mark(btn.dataset.action); });
  });

  // Keyboard
  document.addEventListener('keydown', function(e) {
    // 笔记/速记展开区打开时：仅响应 ESC 收起，其余按键不触发背诵操作
    if (!document.getElementById('wordExtPanel').classList.contains('hidden')) {
      if (e.key === 'Escape') closeExtPanel();
      return;
    }
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    switch (e.code) {
      case 'Space': e.preventDefault(); reveal(); break;
      case 'Digit1': case 'Numpad1': e.preventDefault(); mark('mastered'); break;
      case 'Digit2': case 'Numpad2': e.preventDefault(); mark('unknown'); break;
      case 'ArrowLeft': e.preventDefault(); goPrev(); break;
      case 'ArrowRight': e.preventDefault(); goNext(); break;
    }
  });

  // Init
  if (wordCount === 0) {
    els.wordText.textContent = '没有可学习的单词';
    els.revealBtn.style.display = 'none';
  } else {
    // Clamp index in case it's out of range
    if (currentIndex >= wordCount) currentIndex = 0;
    renderWord();
  }
})();
</script>
{% endblock %}
