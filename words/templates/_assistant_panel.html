<style>
  /* 小助手浮动按钮（背诵/复习通用，右下角） */
  .assistant-fab {
    position: fixed; bottom: 20px; right: 20px; z-index: 90;
    display: flex; align-items: center; gap: 8px;
    padding: 0 20px; height: 50px; border: none; border-radius: 25px; cursor: pointer;
  background: linear-gradient(135deg, var(--c-green), #719375);
    color: #fff; font-size: var(--fs-base); font-weight: 600;
    box-shadow: var(--shadow-lg);
  }
  .assistant-fab:hover { filter: brightness(1.08); }
  .assistant-fab.hidden { display: none; }

  /* 小助手聊天面板 */
  .assistant-panel {
    position: fixed; bottom: 84px; right: 20px; z-index: 90;
    width: 360px; max-width: calc(100vw - 32px);
    height: 480px; max-height: calc(100dvh - 120px);
    display: flex; flex-direction: column;
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden;
  }
  .assistant-panel.hidden { display: none; }

  .assistant-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--c-border-light);
    background: var(--c-surface-2);
  }
  .assistant-header-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }

  .assistant-body {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .assistant-msg {
    max-width: 85%; padding: 8px 12px; border-radius: 12px;
    font-size: var(--fs-sm); line-height: 1.6;
    word-break: break-word;
  }
  .assistant-msg.user {
    white-space: pre-wrap; align-self: flex-end;
    background: var(--c-green); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .assistant-msg.ai {
    white-space: normal; align-self: flex-start;
    background: var(--c-surface-2);
    border: 1px solid var(--c-border-light); border-bottom-left-radius: 4px;
  }

  /* AI 回答 Markdown 排版 */
  .assistant-msg.ai h1, .assistant-msg.ai h2, .assistant-msg.ai h3, .assistant-msg.ai h4 {
    margin: 8px 0 4px; font-weight: 700; line-height: 1.4;
  }
  .assistant-msg.ai h1 { font-size: 1.1rem; }
  .assistant-msg.ai h2 { font-size: 1.05rem; }
  .assistant-msg.ai h3, .assistant-msg.ai h4 { font-size: 1rem; }
  .assistant-msg.ai p { margin: 4px 0; }
  .assistant-msg.ai ul, .assistant-msg.ai ol { margin: 4px 0; padding-left: 18px; }
  .assistant-msg.ai li { margin: 2px 0; }
  .assistant-msg.ai hr { border: none; border-top: 1px solid var(--c-border); margin: 8px 0; }
  .assistant-msg.ai code {
    background: rgba(127, 127, 127, .14); padding: 1px 4px; border-radius: 4px;
    font-size: .9em; font-family: Consolas, Monaco, monospace;
  }
  .assistant-msg.ai pre {
    background: rgba(127, 127, 127, .12); padding: 8px 10px; border-radius: 8px;
    overflow-x: auto; margin: 6px 0; white-space: pre;
  }
  .assistant-msg.ai pre code { background: none; padding: 0; }
  .assistant-msg.ai blockquote {
    border-left: 3px solid var(--c-green); background: var(--c-green-bg);
    margin: 6px 0; padding: 4px 10px; border-radius: 0 8px 8px 0;
  }
  .assistant-msg.ai table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: .95em; }
  .assistant-msg.ai th, .assistant-msg.ai td { border: 1px solid var(--c-border); padding: 4px 8px; text-align: left; }
  .assistant-msg.ai a { color: var(--c-green); text-decoration: underline; word-break: break-all; }
  .assistant-msg-time { display: block; margin-top: 4px; font-size: 10px; opacity: .65; }
  .assistant-msg.user .assistant-msg-time { text-align: right; }

  .assistant-empty {
    color: var(--c-text-3); text-align: center; font-size: var(--fs-sm);
    margin: auto; line-height: 1.8; padding: 0 8px;
  }

  .assistant-actions {
    padding: 8px 12px 0; border-top: 1px solid var(--c-border-light);
    background: var(--c-surface-2); display: flex; gap: 6px; flex-wrap: wrap;
  }
  .assistant-input-row {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px; border-top: 1px solid var(--c-border-light);
    background: var(--c-surface-2);
  }
  .assistant-input-row textarea { flex: 1; resize: none; min-height: 38px; max-height: 100px; }

  @media (max-width: 768px) {
    .assistant-fab { bottom: 84px; right: 16px; width: 50px; height: 50px; padding: 0; justify-content: center; border-radius: 50%; }
    .assistant-fab span { display: none; }
    .assistant-panel { bottom: 148px; right: 16px; left: 16px; width: auto; }
  }
</style>

<!-- 小助手聊天面板（背诵/复习共用，对话历史互通） -->
<div id="assistantPanel" class="assistant-panel hidden">
  <div class="assistant-header">
    <div class="assistant-header-title">
      <i class="ph ph-chat-circle-text" style="color: var(--c-green);"></i> 小助手
    </div>
    <div style="display: flex; gap: 4px;">
      <button class="btn btn-ghost btn-sm" onclick="AssistantPanel.clearHistory()" title="清空对话记录"><i class="ph ph-trash"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="AssistantPanel.close()" title="收起 (ESC)"><i class="ph ph-x"></i></button>
    </div>
  </div>
  <div id="assistantBody" class="assistant-body">
    <div class="assistant-empty">加载对话记录…</div>
  </div>
  <div class="assistant-actions">
    <button id="assistantAskWordBtn" class="btn btn-secondary btn-sm" onclick="AssistantPanel.askCurrentWord()"><i class="ph ph-lightbulb"></i> 问当前单词考法</button>
  </div>
  <div class="assistant-input-row">
    <textarea id="assistantInput" class="form-input" rows="1" placeholder="随便问点什么…（Enter 发送）"></textarea>
    <button id="assistantSendBtn" class="btn btn-primary" onclick="AssistantPanel.sendFromInput()" title="发送"><i class="ph ph-paper-plane-tilt"></i></button>
  </div>
</div>

<button id="assistantFab" class="assistant-fab" onclick="AssistantPanel.toggle()" title="小助手">
  <i class="ph ph-chat-circle-text" style="font-size: 1.3rem;"></i> <span>小助手</span>
</button>
