{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 考研单词背诵系统</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .login-card { width: 100%; max-width: 360px; padding: 32px 28px; }
    .login-logo { font-size: var(--fs-lg); font-weight: 700; text-align: center; margin-bottom: 24px; }
    .login-logo i { color: var(--c-green); font-size: 1.3em; vertical-align: -2px; }
    .login-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 16px; font-size: var(--fs-sm); text-align: center; }
    [data-theme="dark"] .login-error { background: #3f1d1d; color: #fca5a5; border-color: #7f1d1d; }
    .login-btn { width: 100%; padding: 10px 0; font-size: var(--fs-md); }
    .login-tip { margin-top: 16px; text-align: center; font-size: var(--fs-xs); color: var(--c-text-3); }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="login-logo"><i class="ph ph-book-open"></i> 考研<span onclick="submitLogin()">单词</span>背诵系统</div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <div id="loginFakeError" class="login-error hidden">用户名或密码错误</div>

    <form method="post" action="{% url 'words:login' %}" id="loginForm">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" class="form-input" name="username" value="{{ request.POST.username }}" required autofocus placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" name="password" required placeholder="请输入密码">
      </div>
      <button type="button" class="btn btn-primary login-btn" onclick="showFakeError()">登 录</button>
    </form>

    <div class="login-tip">个人学习系统，仅限本人使用</div>
  </div>

  <script>
    // 跟随已保存的主题
    (function () {
      var saved = localStorage.getItem('vocab-theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    // 隐藏按钮：点击上方「单词」二字提交登录（登录按钮仅为装饰）
    function submitLogin() {
      var f = document.getElementById('loginForm');
      if (f.requestSubmit) f.requestSubmit(); else f.submit();
    }

    // 迷惑按钮：点「登 录」永远提示密码错误，实际无法登录
    function showFakeError() {
      document.getElementById('loginFakeError').classList.remove('hidden');
    }
  </script>
</body>
</html>
